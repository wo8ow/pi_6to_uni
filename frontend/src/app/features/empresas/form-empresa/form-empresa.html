<div class="flex justify-content-center mt-4">
  <p-card [header]="titulo" [style]="{ width: '400px' }">
    <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-column gap-3">
      <div class="flex flex-column gap-2">
        <label for="identificacion">Identificación</label>
        <input pInputText id="identificacion" formControlName="identificacion" />
        <small *ngIf="form.get('identificacion')?.invalid && form.get('identificacion')?.touched" class="p-error">
          Identificación es requerida
        </small>
      </div>

      <div class="flex flex-column gap-2">
        <label for="nombre">Nombre</label>
        <input pInputText id="nombre" formControlName="nombre" />
        <small *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="p-error">
          Nombre es requerido
        </small>
      </div>

      <div class="flex flex-column gap-2">
        <label for="sector">Sector</label>
        <input pInputText id="sector" formControlName="sector" />
        <small *ngIf="form.get('sector')?.invalid && form.get('sector')?.touched" class="p-error">
          Sector es requerido
        </small>
      </div>

      <div class="flex flex-column gap-2">
        <label for="monedaCodigo">Código Moneda</label>
        <input pInputText id="monedaCodigo" formControlName="monedaCodigo" />
        <small *ngIf="form.get('monedaCodigo')?.invalid && form.get('monedaCodigo')?.touched" class="p-error">
          Moneda es requerida
        </small>
      </div>

      <div class="flex align-items-center gap-2" *ngIf="empresaId">
        <p-checkbox formControlName="activo" [binary]="true" inputId="activo"></p-checkbox>
        <label for="activo">Activo</label>
      </div>

      <div class="flex justify-content-end gap-2 mt-3">
        <p-button label="Cancelar" severity="secondary" (onClick)="cancelar()"></p-button>
        <p-button label="Guardar" type="submit" [disabled]="form.invalid"></p-button>
      </div>
    </form>
  </p-card>
</div>
