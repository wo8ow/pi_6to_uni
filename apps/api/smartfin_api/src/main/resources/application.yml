server:
  port: 8080

spring:
  application:
    name: smartfin-api

  datasource:
    url: ${SMARTFIN_DB_URL:jdbc:postgresql://localhost:5432/smartfin_operacional}
    username: ${SMARTFIN_DB_USUARIO:smartfin}
    password: ${SMARTFIN_DB_CLAVE:smartfin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: smartfin
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Guayaquil

  jackson:
    time-zone: America/Guayaquil

logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    path: /documentacion
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /documentacion/api-docs

smartfin:
  jwt:
    # minimo 32 caracteres
    secreto: ${SMARTFIN_JWT_SECRETO:smartfin_secreto_de_desarrollo_cambiar_antes_de_produccion_1234567890_abcdef}
    minutos_expiracion: ${SMARTFIN_JWT_MINUTOS_EXPIRACION:120}
    emisor: ${SMARTFIN_JWT_EMISOR:smartfin-api}
